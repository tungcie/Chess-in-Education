<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Chess Empire – video player</title>
<style>
  @font-face { font-family: BVP; font-weight: 500; src: url(../assets/fonts/BeVietnamPro-Medium.ttf); }
  @font-face { font-family: BVP; font-weight: 600; src: url(../assets/fonts/BeVietnamPro-SemiBold.ttf); }
  @font-face { font-family: BVP; font-weight: 700; src: url(../assets/fonts/BeVietnamPro-Bold.ttf); }
  @font-face { font-family: BVP; font-weight: 800; src: url(../assets/fonts/BeVietnamPro-ExtraBold.ttf); }
  @font-face { font-family: BVP; font-weight: 900; src: url(../assets/fonts/BeVietnamPro-Black.ttf); }
  :root { --gold: #F2C230; --gold2: #FFE38A; --goldDeep: #B8861B; --ink: #0D0D10; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); font-family: BVP, sans-serif; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  #bg, #fx { position: absolute; inset: 0; }
  .abs { position: absolute; }
  #progress { left: 0; top: 0; height: 10px; background: linear-gradient(90deg, var(--goldDeep), var(--gold2)); }
  #chip { left: 60px; top: 200px; padding: 10px 26px; border-radius: 40px; font-weight: 800; font-size: 34px; letter-spacing: 3px;
          color: var(--ink); background: linear-gradient(180deg, var(--gold2), var(--gold)); box-shadow: 0 6px 24px rgba(242,194,48,.35); }
  #title { left: 60px; top: 272px; width: 900px; font-weight: 900; font-size: 74px; line-height: 1.08; color: #fff;
           text-shadow: 0 4px 0 rgba(0,0,0,.35); white-space: pre-line; }
  #title b { color: var(--gold); }
  #logoTop { right: 130px; top: 190px; height: 130px; }
  #board { left: 60px; top: 400px; width: 900px; height: 900px; }
  #coach { width: 340px; height: 442px; }
  #coachLogo { position: absolute; }
  #caption { left: 380px; top: 1340px; width: 580px; min-height: 120px; padding: 26px 30px; box-sizing: border-box;
             border-radius: 32px; background: rgba(16,16,20,.88); border: 3px solid rgba(242,194,48,.65);
             color: #fff; font-weight: 700; font-size: 44px; line-height: 1.28; box-shadow: 0 14px 40px rgba(0,0,0,.45); }
  #caption .k { color: var(--gold); }
  #caption::before { content: ""; position: absolute; left: -22px; top: 54px; border: 14px solid transparent;
                     border-right: 22px solid rgba(242,194,48,.75); border-left: 0; }
  #label { left: 60px; top: 1316px; padding: 8px 20px; border-radius: 14px; background: rgba(255,255,255,.1);
           color: var(--gold2); font-weight: 700; font-size: 32px; }
  #sticker { left: 0; width: 1080px; text-align: center; pointer-events: none; }
  #sticker span { display: inline-block; padding: 18px 40px; border-radius: 22px; font-weight: 900; font-size: 92px;
                  color: #fff; border: 8px solid #fff; box-shadow: 0 18px 40px rgba(0,0,0,.5); }
  #recap { left: 60px; top: 400px; width: 900px; }
  .card { display: flex; align-items: center; gap: 30px; margin-bottom: 26px; padding: 24px 34px; border-radius: 30px;
          background: linear-gradient(135deg, rgba(242,194,48,.18), rgba(255,255,255,.04)); border: 3px solid rgba(242,194,48,.55); }
  .card .n { flex: 0 0 110px; height: 110px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 64px;
             color: var(--ink); background: linear-gradient(180deg, var(--gold2), var(--gold)); }
  .card .t { color: #fff; font-weight: 800; font-size: 54px; line-height: 1.15; white-space: pre-line; }
  .card .t small { display: block; font-size: 34px; font-weight: 600; color: var(--gold2); }
  #endcard { left: 60px; top: 1000px; width: 900px; display: flex; align-items: center; gap: 34px; }
  #endcard img.photo { width: 200px; height: 200px; border-radius: 50%; object-fit: cover; object-position: 50% 12%;
                       border: 8px solid var(--gold); box-shadow: 0 0 50px rgba(242,194,48,.45); }
  #endcard .name { color: #fff; font-weight: 900; font-size: 56px; line-height: 1.1; }
  #endcard .sub { color: var(--gold2); font-weight: 600; font-size: 34px; margin-top: 6px; }
  #equation { left: 0; width: 1080px; display: flex; justify-content: center; align-items: center; gap: 14px;
              font-weight: 900; font-size: 64px; color: #fff; }
  #equation .part { display: flex; align-items: center; gap: 4px; padding: 4px 20px 4px 8px; border-radius: 22px; }
  #equation .op { color: var(--gold2); font-size: 58px; }
  #equation svg { width: 76px; height: 76px; }
  #fx, #flash { pointer-events: none; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
  #ring { left: 10px; top: 350px; width: 1000px; height: 1000px; opacity: 0; }
  #hookArt { left: 600px; top: 470px; width: 440px; height: 440px; opacity: 0; }
  #countdown { left: 0; top: 650px; width: 1080px; text-align: center; font-weight: 900; font-size: 360px; color: #fff; opacity: 0;
               text-shadow: 0 0 40px #B46CFF, 0 0 90px #5EF3FF; }
  #endcard .avatar { width: 200px; height: 200px; border-radius: 50%; overflow: hidden; flex: 0 0 200px;
                     border: 8px solid var(--gold); box-shadow: 0 0 50px rgba(242,194,48,.45); background: #2b1d5c; }
  body.magic { --gold: #FFD54A; --gold2: #FFE9A3; }
  body.magic #chip { background: linear-gradient(90deg, #B46CFF, #FF5EC8); color: #fff; box-shadow: 0 0 30px rgba(180,108,255,.6); }
  body.magic #title { text-shadow: 0 0 24px rgba(180,108,255,.9), 0 4px 0 rgba(0,0,0,.4); }
  body.magic #progress { background: linear-gradient(90deg, #5EF3FF, #B46CFF, #FF5EC8); }
  body.magic #caption { border-color: rgba(94,243,255,.75); background: rgba(20,12,48,.88); box-shadow: 0 0 34px rgba(124,92,255,.45); }
  body.magic #caption::before { border-right-color: rgba(94,243,255,.85); }
  body.magic .card { border-color: rgba(180,108,255,.8); background: linear-gradient(135deg, rgba(180,108,255,.28), rgba(94,243,255,.06)); }
  body.magic .card .n { background: linear-gradient(180deg, #8EF7FF, #B46CFF); color: #fff; }
  body.magic #endcard .avatar { border-color: #B46CFF; box-shadow: 0 0 50px rgba(180,108,255,.6); }
  body.magic #label { background: rgba(180,108,255,.25); color: #E9D8FF; }
  #endcard .cta { display: inline-block; margin-top: 16px; padding: 10px 28px; border-radius: 40px; font-weight: 800; font-size: 36px;
                  background: #FE2C55; color: #fff; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1080" height="1920"></canvas>
  <div id="progress" class="abs"></div>
  <img id="logoTop" class="abs" src="../assets/logo.png">
  <div id="chip" class="abs"></div>
  <div id="title" class="abs"></div>
  <div id="ring" class="abs"></div>
  <div id="hookArt" class="abs"></div>
  <div id="board" class="abs"></div>
  <canvas id="fx" width="1080" height="1920"></canvas>
  <div id="label" class="abs"></div>
  <div id="equation" class="abs"></div>
  <div id="recap" class="abs"></div>
  <div id="endcard" class="abs">
    <img class="photo" src="../assets/coach-photo.png"><div class="avatar"></div>
    <div><div class="name">HLV Tùng</div><div class="sub">Chess Empire Academy</div>
      <div class="sub tag">Học cờ vua – Học cách nghĩ</div><div class="cta">+ Theo dõi</div></div>
  </div>
  <div id="coach" class="abs"></div>
  <img id="coachLogo" src="../assets/logo.png">
  <div id="caption" class="abs"></div>
  <div id="sticker" class="abs"></div>
  <div id="countdown" class="abs"></div>
  <div id="flash"></div>
</div>
<script src="coach.js"></script>
<script src="mon.js"></script>
<script>
// ===== Tiện ích =====
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => (k = clamp(k), k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const back = k => { k = clamp(k); const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const $ = id => document.getElementById(id);
const COL = { gold: '255,213,74', red: '255,77,77', green: '61,220,132', cyan: '94,243,255', purple: '180,108,255' };
const STICKER = { green: '#1FBF6A', red: '#E5212E', purple: 'linear-gradient(90deg,#7B2FFF,#FF3DB8)', gold: '#E0A000' };

let TL, PIECES;
const BS = 900, SQ = BS / 8, FR = 0; // kích thước bàn cờ
const sqXY = s => [(s.charCodeAt(0) - 97) * SQ, (8 - +s[1]) * SQ];

// ===== Nền: ánh vàng + hạt lấp lánh (xác định, không ngẫu nhiên theo khung) =====
const bgCtx = $('bg').getContext('2d');
const SPARKS = Array.from({ length: 70 }, (_, i) => {
  const r = Math.sin(i * 12.9898) * 43758.5453; const f = r - Math.floor(r);
  const r2 = Math.sin(i * 78.233) * 12543.21; const g = r2 - Math.floor(r2);
  return { x: f * 1080, y: g * 1920, s: 1.5 + (i % 5), sp: 8 + (i % 7) * 4, ph: i * 0.7 };
});
function drawMagicBg(t) {
  const c = bgCtx;
  const g = c.createRadialGradient(540, 820, 60, 540, 900, 1400);
  g.addColorStop(0, '#3b1f78'); g.addColorStop(.4, '#1a0f3d'); g.addColorStop(1, '#07051a');
  c.fillStyle = g; c.fillRect(0, 0, 1080, 1920);
  // tinh vân trôi chậm
  for (let i = 0; i < 4; i++) {
    const x = 540 + Math.sin(t * .15 + i * 1.7) * 380, y = 400 + i * 420 + Math.cos(t * .12 + i) * 80;
    const n = c.createRadialGradient(x, y, 0, x, y, 420);
    n.addColorStop(0, i % 2 ? 'rgba(255,94,200,.16)' : 'rgba(94,243,255,.13)'); n.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = n; c.fillRect(0, 0, 1080, 1920);
  }
  for (const p of SPARKS) {
    const y = (p.y - t * p.sp * .6 + 1920) % 1920, tw = Math.sin(t * 3 + p.ph) ** 2;
    c.fillStyle = `rgba(${p.ph % 2 > 1 ? '255,233,163' : '200,240,255'},${.2 + .7 * tw})`;
    const x = p.x + Math.sin(t * .5 + p.ph) * 10, r = p.s * (.6 + .6 * tw);
    c.beginPath(); c.moveTo(x, y - r * 2.4); c.lineTo(x + r * .6, y); c.lineTo(x, y + r * 2.4); c.lineTo(x - r * .6, y); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(x - r * 2.4, y); c.lineTo(x, y + r * .6); c.lineTo(x + r * 2.4, y); c.lineTo(x, y - r * .6); c.closePath(); c.fill();
  }
}
// vòng phép thuật xoay (chữ rune giả bằng nét vẽ)
function magicRingSVG(t, glow = 1) {
  let runes = '';
  for (let i = 0; i < 24; i++) {
    const a = i / 24 * Math.PI * 2, x = 500 + Math.cos(a) * 430, y = 500 + Math.sin(a) * 430;
    runes += `<g transform="translate(${x} ${y}) rotate(${a * 180 / Math.PI + 90})"><path d="M -10 -14 L 0 14 L 10 -14 M -12 0 L 12 0" stroke="#C9A6FF" stroke-width="4" fill="none"/></g>`;
  }
  return `<svg viewBox="0 0 1000 1000" width="100%" height="100%" style="filter:drop-shadow(0 0 18px rgba(180,108,255,${.8 * glow}))">
    <g transform="rotate(${t * 12} 500 500)" fill="none" stroke="#B46CFF" stroke-width="5" opacity=".85">
      <circle cx="500" cy="500" r="480"/><circle cx="500" cy="500" r="380" stroke-dasharray="18 14"/>${runes}</g>
    <g transform="rotate(${-t * 20} 500 500)" fill="none" stroke="#5EF3FF" stroke-width="4" opacity=".7">
      <polygon points="500,130 820,685 180,685"/><polygon points="500,870 180,315 820,315"/></g></svg>`;
}
function lightning(x1, y1, x2, y2, seed) {
  let d = `M ${x1} ${y1}`, n = 7;
  for (let i = 1; i < n; i++) {
    const k = i / n, j = Math.sin(seed * 9.1 + i * 3.7) * 34;
    d += ` L ${lerp(x1, x2, k) + j} ${lerp(y1, y2, k) + j * .4}`;
  }
  return d + ` L ${x2} ${y2}`;
}
function hookArtSVG(t) {
  const flick = Math.sin(t * 23) > .2 ? 1 : .35;
  const bolts = [0, 1, 2, 3].map(i => {
    const a = i * Math.PI / 2 + .5 + Math.sin(t) * .2;
    return `<path d="${lightning(220, 220, 220 + Math.cos(a) * 215, 220 + Math.sin(a) * 215, Math.floor(t * 8) + i)}" stroke="#E6FBFF" stroke-width="5" fill="none" opacity="${flick}"/>`;
  }).join('');
  const bob = Math.sin(t * 2) * 10;
  return `<svg viewBox="0 0 440 440" width="100%" height="100%"><defs>${PIECES}
    <radialGradient id="hg"><stop offset="0" stop-color="#8EF7FF" stop-opacity=".9"/><stop offset="1" stop-color="#7B2FFF" stop-opacity="0"/></radialGradient></defs>
    <circle cx="220" cy="220" r="210" fill="url(#hg)"/>
    <g style="filter:drop-shadow(0 0 12px #5EF3FF)">${bolts}</g>
    <use href="#${TL.hookPiece || 'wR'}" x="90" y="${80 + bob}" width="260" height="260" style="filter:drop-shadow(0 0 26px #fff) drop-shadow(0 0 40px #B46CFF)"/></svg>`;
}
function drawBg(t) {
  if (TL.theme === 'magic') return drawMagicBg(t);
  const c = bgCtx;
  const g = c.createRadialGradient(540, 760, 80, 540, 900, 1300);
  g.addColorStop(0, '#3a2a0c'); g.addColorStop(.45, '#17130b'); g.addColorStop(1, '#0a0a0c');
  c.fillStyle = g; c.fillRect(0, 0, 1080, 1920);
  for (const p of SPARKS) {
    const y = (p.y - t * p.sp + 1920) % 1920;
    const a = .25 + .35 * Math.sin(t * 2 + p.ph) ** 2;
    c.fillStyle = `rgba(255,214,110,${a})`;
    c.beginPath(); c.arc(p.x + Math.sin(t * .6 + p.ph) * 14, y, p.s, 0, 7); c.fill();
  }
}

// ===== Bàn cờ =====
function pieceUse(sym, x, y, extra = '') {
  const id = (sym === sym.toUpperCase() ? 'w' : 'b') + sym.toUpperCase();
  return `<use href="#${id}" x="${x}" y="${y}" width="${SQ}" height="${SQ}" ${extra}/>`;
}
function overlaysAt(t, scene) {
  // các sự kiện hiển thị đang có hiệu lực trong cảnh hiện tại (sau lệnh "clear" gần nhất)
  const evs = TL.overlays.filter(o => o.t <= t && o.t >= scene.t0 && o.t < scene.t1);
  let lastClear = -1;
  evs.forEach((o, i) => { if (o.type === 'clear') lastClear = i; });
  return { active: evs.slice(lastClear + 1), all: evs };
}
function arrowSVG(from, to, color, k) {
  const [x1, y1] = sqXY(from).map(v => v + SQ / 2), [x2, y2] = sqXY(to).map(v => v + SQ / 2);
  const L = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / L, uy = (y2 - y1) / L;
  const len = (L - SQ * .32) * ease(k), hx = x1 + ux * len, hy = y1 + uy * len;
  const w = 26, head = 50, nx = -uy, ny = ux;
  const bx = hx - ux * head, by = hy - uy * head;
  return `<g opacity="${clamp(k * 3) * .88}">
    <line x1="${x1}" y1="${y1}" x2="${bx}" y2="${by}" stroke="rgb(${COL[color]})" stroke-width="${w}" stroke-linecap="round"/>
    <polygon points="${hx},${hy} ${bx + nx * 34},${by + ny * 34} ${bx - nx * 34},${by - ny * 34}" fill="rgb(${COL[color]})"/></g>`;
}
// Màu theo vòng: Xe một màu xanh dương cố định; Tượng đổi màu từ mép (xanh lá) vào trung tâm (đỏ).
const ROOK_COL = '#3B6FE0', RING_COL = ['#22A866', '#E8B21E', '#F07A2A', '#E2283F'];
function heatSVG(heats, t) {
  let defs = '', s = '';
  RING_COL.forEach((c, i) => {   // Hậu = phối màu Xe + màu Tượng của vòng đó
    defs += `<linearGradient id="qg${i}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${ROOK_COL}"/><stop offset=".5" stop-color="${ROOK_COL}"/><stop offset=".5" stop-color="${c}"/><stop offset="1" stop-color="${c}"/></linearGradient>`;
  });
  s += `<defs>${defs}</defs>`;
  // ô mới nhất của mỗi ô vuông thắng (sự kiện sau đè sự kiện trước)
  const cell = {};
  heats.forEach(o => { for (const [sq, c] of Object.entries(o.cells)) cell[sq] = { ...c, piece: o.piece, t0: o.t, stagger: o.stagger ?? .012 }; });
  for (const [sq, c] of Object.entries(cell)) {
    const [x, y] = sqXY(sq), f = sq.charCodeAt(0) - 97, r = +sq[1] - 1;
    const k = back((t - c.t0 - (f + (7 - r)) * c.stagger) / .32);
    if (k <= 0) continue;
    const KN = { 2: '#E2283F', 3: '#F07A2A', 4: '#E8B21E', 6: '#22A866', 8: '#2B8FE8' };
    const fill = c.piece === 'R' ? ROOK_COL : c.piece === 'B' ? RING_COL[c.ring] : c.piece === 'N' ? KN[c.n] : `url(#qg${c.ring})`;
    const glow = c.ring === 3 && !'RN'.includes(c.piece) ? `<rect x="${x + 2}" y="${y + 2}" width="${SQ - 4}" height="${SQ - 4}" rx="18" fill="none" stroke="#FFE38A" stroke-width="${4 + 3 * Math.sin(t * 6) ** 2}"/>` : '';
    s += `<g transform="translate(${x + SQ / 2} ${y + SQ / 2}) scale(${k}) translate(${-x - SQ / 2} ${-y - SQ / 2})">
      <rect x="${x + 6}" y="${y + 6}" width="${SQ - 12}" height="${SQ - 12}" rx="16" fill="${fill}" stroke="rgba(255,255,255,.55)" stroke-width="3"/>${glow}`;
    if (c.piece === 'Q') {
      s += `<text x="${x + SQ / 2}" y="${y + 38}" font-size="21" font-weight="800" text-anchor="middle" fill="rgba(255,255,255,.92)" font-family="BVP">${c.r}+${c.b}</text>
            <text x="${x + SQ / 2}" y="${y + 84}" font-size="44" font-weight="900" text-anchor="middle" fill="#fff" font-family="BVP" style="paint-order:stroke" stroke="rgba(0,0,0,.25)" stroke-width="4">${c.n}</text>`;
    } else {
      s += `<text x="${x + SQ / 2}" y="${y + SQ / 2 + 17}" font-size="48" font-weight="900" text-anchor="middle" fill="#fff" font-family="BVP" style="paint-order:stroke" stroke="rgba(0,0,0,.25)" stroke-width="4">${c.n}</text>`;
    }
    s += '</g>';
  }
  return s;
}
// Phương trình  [Xe] 14 + [Tượng] 13 = [Hậu] 27  phía trên bàn cờ
function equationHTML(o, t, prev) {
  const icon = id => `<svg viewBox="0 0 45 45"><defs>${PIECES}</defs><use href="#${id}" width="45" height="45"/></svg>`;
  // lần đầu: hiện lần lượt từng vế; các lần sau: chỉ nảy phần số thay đổi
  const pop = (i) => {
    if (prev && i === 0) return '';
    const k = back((t - o.t - (prev ? (i - 1) * .15 : i * .25)) / .3);
    return `opacity:${clamp(k)};transform:scale(${prev ? .85 + .15 * k : k})`;
  };
  const ringI = [7, 9, 11, 13].indexOf(o.b);
  const parts = [
    `<span class="part" style="background:${ROOK_COL};${pop(0)}">${icon('wR')}${o.a}</span>`,
    `<span class="op" style="${pop(1)}">+</span>`,
    `<span class="part" style="background:${RING_COL[Math.max(0, ringI)]};${pop(1)}">${icon('wB')}${o.b}</span>`,
    `<span class="op" style="${pop(2)}">=</span>`,
    `<span class="part" style="background:linear-gradient(135deg, ${ROOK_COL} 50%, ${RING_COL[Math.max(0, ringI)]} 50%);${pop(2)}">${icon('wQ')}${o.c}</span>`,
  ];
  return parts.join('');
}
function beamSVG(o, dt, layer) {
  const [fx, fy] = sqXY(o.from).map(v => v + SQ / 2);
  let s = '';
  const pulse = .75 + .25 * Math.sin(dt * 9);
  for (const r of o.rays) {
    if (o.only && !o.only.includes(r.to) && !o.only.includes(r.block)) continue;
    if (r.to && layer === 'line') {
      const [tx, ty] = sqXY(r.to).map(v => v + SQ / 2), k = ease(dt / .5);
      const ex = lerp(fx, tx, k), ey = lerp(fy, ty, k);
      s += `<line x1="${fx}" y1="${fy}" x2="${ex}" y2="${ey}" stroke="rgba(94,243,255,${.6 * pulse})" stroke-width="56" stroke-linecap="round" filter="url(#glow)"/>
            <line x1="${fx}" y1="${fy}" x2="${ex}" y2="${ey}" stroke="rgba(180,108,255,.85)" stroke-width="20" stroke-linecap="round"/>
            <line x1="${fx}" y1="${fy}" x2="${ex}" y2="${ey}" stroke="#fff" stroke-width="6" stroke-linecap="round"/>`;
    }
    if (layer !== 'mark') continue;
    if (r.to) {
      if (r.hit && dt > .5) {
        const [hx, hy] = sqXY(r.hit), q = back((dt - .5) / .3);
        s += `<rect x="${hx + 6}" y="${hy + 6}" width="${SQ - 12}" height="${SQ - 12}" rx="14" fill="rgba(255,60,100,${.35 * pulse})" stroke="#FF5E78" stroke-width="${8 * q}"/>`;
      }
    }
    if (r.block && dt > .5) {
      const [bx, by] = sqXY(r.block), q = back((dt - .5) / .3);

  let shake = 0, flash = 0;
  for (const o of TL.overlays) {
    const dt = t - o.t;
    if (o.type === 'boom') {
      const [sx, sy] = sqXY(o.square);
      const bb = TL.boardBox || { x: 60, y: 400, size: 900 }, u = bb.size / 928;
      burst(c, bb.x + (sx + SQ / 2 + 14) * u, bb.y + (sy + SQ / 2 + 14) * u, dt, 1.3, '255,94,120');
      if (dt >= 0 && dt < .45) { shake = Math.max(shake, 22 * (1 - dt / .45)); flash = Math.max(flash, .55 * (1 - dt / .25)); }
    }
    if (o.type === 'flash' && dt >= 0 && dt < .5) { shake = Math.max(shake, 26 * (1 - dt / .5)); flash = Math.max(flash, .9 * (1 - dt / .3)); }
    if (o.type === 'magic') burst(c, cx + cw * .84, cy + cw * .55, dt, .4, '94,243,255');
    if (o.type === 'sticker' && scene.layout === 'hook') burst(c, 540, 1460, dt, 2.1, '180,108,255');
  }
  // đếm ngược
  const cd = TL.overlays.filter(o => o.type === 'countdown' && t >= o.t && t - o.t < .9).pop();
  if (cd) {
    const dt = t - cd.t;
    $('countdown').textContent = cd.n; $('countdown').style.opacity = 1 - clamp((dt - .55) / .35);
    $('countdown').style.transform = `scale(${1.6 - .6 * back(dt / .3)})`;
  } else $('countdown').style.opacity = 0;
  $('flash').style.opacity = clamp(flash);
  $('stage').style.transform = shake ? `translate(${Math.sin(t * 91) * shake}px, ${Math.cos(t * 77) * shake}px)` : '';
}

window.setup = (timeline, pieces) => {
  TL = timeline; PIECES = pieces;
  TL.boardStyle = TL.boardStyle || {};
  const bb = TL.boardBox || { x: 60, y: 400, size: 900 };
  Object.assign($('board').style, { left: bb.x + 'px', top: bb.y + 'px', width: bb.size + 'px', height: bb.size + 'px' });
  $('label').style.top = (bb.y + bb.size + 14) + 'px'; $('label').style.left = 'auto';
  $('label').style.right = (1080 - bb.x - bb.size) + 'px';   // canh phải để nhân vật không che
  $('equation').style.top = (bb.y - 104) + 'px';
  document.body.classList.toggle('magic', TL.theme === 'magic');
  const ec = TL.endcard || {};
  const isMon = TL.character === 'mon';
  document.querySelector('#endcard .photo').style.display = isMon ? 'none' : '';
  document.querySelector('#endcard .avatar').style.display = isMon ? '' : 'none';
  if (isMon) document.querySelector('#endcard .avatar').innerHTML =
    `<div style="width:200px;height:260px;margin-top:-8px">${monSVG({ mouth: .4 })}</div>`;
  if (ec.name) document.querySelector('#endcard .name').textContent = ec.name;
  if (ec.sub) document.querySelector('#endcard .sub').textContent = ec.sub;
  if (ec.tagline) document.querySelector('#endcard .tag').textContent = ec.tagline;
};
</script>
<style> #caption.nobubble::before { display: none; } </style>
